<style>

}

:root[data-theme="dark"]{
  --bg:#12171e; --bar:rgba(18,23,30,.94); --surface:#1b222c; --ink:#e8edf3; --muted:#9aa7b6; --line:#2e3846;
  --accent:#7fb0ff; --accent-ink:#0c1b33; --accent-soft:#1e2f4d;
  --hint:#f5b84a; --hint-soft:#33280f;
  --good:#5fd38a; --good-soft:#123221; --bad:#ff8a80; --bad-soft:#3d1c19;
  --c1:#7fb0ff; --c2:#ff9a6b; --c3:#6fd9a1; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:900px;margin:0 auto;padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.brand{font-weight:700;margin-right:auto;font-size:1.02rem;min-width:0}
.prog{min-width:130px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ptxtrow{display:flex;justify-content:space-between;gap:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:2px}
.bar>span{display:block;height:100%;width:0;background:var(--good);transition:width .25s}
.chips{max-width:900px;margin:0 auto;padding:0 14px 8px;display:flex;gap:6px;overflow-x:auto}
.chips a{flex:none;min-width:34px;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 10px;font-weight:600;font-size:.9rem}
.chips a:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;font-size:.93rem;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:3px 10px;font-size:.82rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:6px 2px;font-size:.9rem}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 90px}
h1{font-size:clamp(1.55rem,5vw,2.1rem);line-height:1.15;margin:24px 0 4px;text-wrap:balance}
h2{font-size:1.3rem;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.small{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.how ol{margin:6px 0 10px;padding-left:22px}
.how li{margin-bottom:3px}
.part{margin-top:34px;scroll-margin-top:96px}
.part>h2{padding-top:6px;border-top:3px solid var(--accent)}
.pn{color:var(--accent)}
.intro{color:var(--muted);max-width:68ch;margin:4px 0 8px}
.task{scroll-margin-top:100px}
.task.done{border-color:var(--good)}
.thead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:4px}
.tnum{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.ttitle{font-weight:700}
.tdone{margin-left:auto;color:var(--good);font-weight:800;visibility:hidden}
.task.done .tdone{visibility:visible}
.ttext{margin:2px 0 10px;max-width:70ch}
.tw{overflow-x:auto;margin:6px 0 10px;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;font-size:.97rem;min-width:min(100%,0px)}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 9px;text-align:center;vertical-align:middle;white-space:nowrap}
.tbl thead th{background:var(--accent-soft)}
.tbl tbody th,.tbl tr>th:first-child{background:var(--bg);text-align:left;font-weight:600}
.tbl td.wd{white-space:normal;text-align:left;font-size:.9rem;color:var(--muted)}
.how .tbl td:first-child{text-align:left;white-space:normal}
.fld{width:4.6em;max-width:100%;padding:5px 7px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);text-align:center;font-size:1rem;min-height:36px}
.fld.sel{width:auto;max-width:15em;text-align:left;padding-right:4px}
.fld:focus{border-color:var(--accent)}
.fld.ok{border-color:var(--good);background:var(--good-soft)}
.fld.bad{border-color:var(--bad);background:var(--bad-soft)}
.bl{margin:8px 0;line-height:2.3}
.bl .fld{margin:0 3px}
.mc{margin:10px 0}.mcq{margin:0 0 6px;font-weight:600}
.opt{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;margin:6px 0;min-height:44px}
.opt .lab{font-weight:700;color:var(--muted);flex:none}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.open{margin:10px 0}
.oq{margin:0 0 4px;font-weight:600}
.ta{width:100%;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 10px;resize:vertical;min-height:48px}
.ta:focus{border-color:var(--accent)}
.ref{margin-top:6px;background:var(--good-soft);border-left:4px solid var(--good);padding:7px 11px;border-radius:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.hintbox{margin-top:10px;background:var(--hint-soft);border-left:4px solid var(--hint);padding:8px 12px;border-radius:6px}

.msg{min-height:1.4em;margin-top:8px;font-weight:600;font-size:.95rem}
.msg.good{color:var(--good)}.msg.warn{color:var(--bad)}
.tick{margin-top:8px}
.tickbtn[aria-pressed=true]{background:var(--good-soft);border-color:var(--good)}
.notice{background:var(--accent-soft);border-color:transparent}
.nlabel{font-weight:700;margin-bottom:6px}
.notice .ta{background:var(--surface)}
.rulebox{margin-top:10px;background:var(--surface);border-left:5px solid var(--accent);padding:10px 14px;border-radius:8px}
.rulebox.plain{margin:12px 0;border:1px solid var(--line);border-left:5px solid var(--accent)}
.rulebox[hidden]{display:none}
.worked{margin:12px 0;border:1px dashed var(--line);padding:10px 14px;border-radius:8px;background:var(--surface)}
.careful{margin:12px 0;background:var(--hint-soft);border-left:5px solid var(--hint);padding:10px 14px;border-radius:8px}
.figrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.figrow>div{flex:1 1 260px;min-width:0}
.figone{max-width:460px;margin:8px 0}.figstack{max-width:520px;margin:8px 0}
.plot{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.plot .ax{stroke:var(--muted);stroke-width:1.2}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot .tk{stroke:var(--muted);stroke-width:1}
.plot text{paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.plot .tl,.plot .pl{fill:var(--muted);font-size:11px}
.plot .pl{fill:var(--ink);font-weight:600}
.plot .asy{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.8}
.plot .cv{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.plot .c1{stroke:var(--c1)}.plot .c2{stroke:var(--c2)}.plot .c3{stroke:var(--c3)}
.plot .cl{font-size:13px;font-weight:700}
.plot .c1t{fill:var(--c1)}.plot .c2t{fill:var(--c2)}.plot .c3t{fill:var(--c3)}
.plot .pt{fill:var(--ink)}
.plot .pt.hol{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.timerrow{display:flex;gap:12px;align-items:center;margin:8px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.2rem}
.timer.low{color:var(--bad)}
.q .qq{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-weight:600}
.qn{color:var(--accent)}
.qpart{margin-left:auto;font-weight:400;color:var(--muted);font-size:.85rem}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px;margin-top:6px}
@media (max-width:560px){.qopts{grid-template-columns:1fr}.topin{gap:4px 10px}.brand{flex:1 1 100%}.prog{flex:1}}
.qfb{min-height:1.3em;font-weight:600;font-size:.92rem;margin-top:2px}
.qfb.good{color:var(--good)}.qfb.bad{color:var(--bad)}
.result{margin-top:10px;font-weight:700;font-size:1.15rem}

.back{flex:none;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;color:var(--ink)}
.back:hover{border-color:var(--accent)}
.nextlink{margin:34px 0 0;font-weight:700;font-size:1.05rem}
.nextlink a{display:inline-block;text-decoration:none;border:1.5px solid var(--accent);border-radius:10px;padding:10px 16px}
.geo{width:100%;max-width:420px;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.geo line,.geo path,.geo polygon,.geo circle,.geo ellipse,.geo polyline{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.geo .hid{stroke-dasharray:5 4;stroke:var(--muted)}
.geo .acc{stroke:var(--c1);stroke-width:2.2}.geo .acc2{stroke:var(--c2);stroke-width:2.2}.geo .acc3{stroke:var(--c3);stroke-width:2.2}
.geo .dot{fill:var(--ink);stroke:none}
.geo text{fill:var(--ink);font-size:13px;font-weight:600;stroke:none;paint-order:stroke}
.geo .mt{fill:var(--muted);font-weight:400;font-size:12px}
.geo .fillsoft{fill:var(--accent-soft);stroke:var(--c1)}

</style>

    back: 'Назад к списку тем', topics: 'Темы', next: 'Следующая тема', stop: 'Остановить таймер', timeUp: 'Время вышло',

/* option helpers */
const O = (k) => ({ k });                      // key into UI.opt
const YN = [O('yes'), O('no')];
const SON = [O('same'), O('opposite'), O('neither')];
const MON = [O('up'), O('down'), O('change')];
const LR = [{ k: 'left', en: 'left', ru: 'влево' }, { k: 'right', en: 'right', ru: 'вправо' }];

  key: 'csca-math-derivatives-v1',
  title: T('Investigation sheet: Derivatives', 'Исследовательский лист: производные'),
  sub: T('CSCA Mathematics · find each rule yourself, then read it', 'CSCA, математика · найдите каждое правило сами, потом прочитайте его'),

};

SHEET.figs = ({ h, plot }) => ({
  tangent() {
    const s = plot({ label: 'y = x² with a secant line through (1, 1) and (2, 4) and the tangent line at (1, 1)', w: 420, h: 300, x0: -1.2, x1: 2.8, y0: -1.6, y1: 6,

<script>
/* Engine for every CSCA investigation sheet. No external dependencies.
   Globals set by build.py: SUBJECT (subject.json), NAV (links). Set by the sheet: SHEET, PARTS, EXAM, TOPICS. */
(function () {
  const KEY = SHEET.key;
  let state = { lang: null, notices: {}, tasks: {}, inputs: {}, quiz: { ans: {}, checked: false } };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {}
  /* saved exam answers are option indices: if the questions or option order change, start the exam fresh */
  const EXAMSIG = (() => { let x = 5381; const t = EXAM.map(q => q.a + ':' + q.o.map(o => typeof o === 'string' ? o : o.en).join('|')).join('#');
    for (let i = 0; i < t.length; i++) x = (x * 33 + t.charCodeAt(i)) >>> 0; return x.toString(36); })();
  if (state.quiz.sig !== EXAMSIG) state.quiz = { ans: {}, checked: false, sig: EXAMSIG };
  const SUBJ = (typeof SUBJECT !== 'undefined' && SUBJECT) || {};
  const LINKS = (typeof NAV !== 'undefined' && NAV) || {};
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem('csca-lang', state.lang);
      const total = tasksIndex.length, done = tasksIndex.filter(t => state.tasks[t.id] && state.tasks[t.id].done).length;
      if (total) localStorage.setItem('csca-progress:' + KEY, JSON.stringify({ done, total, quiz: state.quiz.checked ? state.quiz.score : null, n: EXAM.length }));
    } catch (e) {}
  }
  try { const g = localStorage.getItem('csca-lang'); if (g === 'en' || g === 'ru') state.lang = g; } catch (e) {}
  if (!state.lang) state.lang = /^ru|^kk|^uk|^be/i.test(navigator.language || '') ? 'ru' : 'en';
  let lang = state.lang;
  const ui = () => UI[lang];
  const tr = (v) => (v == null ? '' : typeof v === 'string' ? v : (v[lang] != null ? v[lang] : v.en));

  /* ---------- tiny DOM helpers ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;

    PARTS.forEach(p => {
      const sec = h('section', { class: 'part', id: 'part-' + p.id }, h('h2', null, h('span', { class: 'pn' }, ui().part + ' ' + p.id + '.'), ' ' + tr(p.title)), P(p.intro, 'intro'));
      p.items.forEach(it => {
        if (it.t === 'task') { const el = buildTask(it); tasksIndex.push({ id: it.id }); sec.append(el); }
        else if (it.t === 'notice') sec.append(buildNotice(it));
        else if (it.t === 'rule') sec.append(h('div', { class: 'rulebox plain' }, h('b', null, tr(it.label) + '. '), h('span', { html: fmt(it.text) })));
        else if (it.t === 'worked') sec.append(h('div', { class: 'worked' }, h('b', null, ui().worked + '. '), h('span', { html: fmt(it.text) })));
        else if (it.t === 'note') sec.append(h('div', { class: 'careful' }, h('b', null, tr(it.label) + '. '), h('span', { html: fmt(it.text) })));
      });
      wrap.append(sec);
    });
    wrap.append(buildExam());
    if (LINKS.next) wrap.append(h('p', { class: 'nextlink' }, h('a', { href: LINKS.next.href }, ui().next + ': ' + tr(LINKS.next.title) + ' →')));
    root.append(wrap);
    updateProgress();
  }
  render();
  save();
  if (window.__FN_TEST) window.__fnt = { num, isCorrect };
})();

</script>
</body>
</html>
